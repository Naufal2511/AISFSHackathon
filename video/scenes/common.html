<style>
  :root { --ink:#18212b; --soft:#3a4652; --mute:#7a8591; --rule:#dfe4ea; --acc:#0f5a6b; --acc-soft:#e7f1f3;
          --warm:#a85a24; --warm-soft:#fbf0e6; --panel:#f3f6f8; --bg:#fbfcfd; --vis:#2e8b6e; --part:#d69a2d; --none:#c9d0d7; --bad:#b4413a; }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--ink);
              font-family:"Avenir Next",Avenir,"Helvetica Neue",sans-serif; }
  .eyebrow { font-size:20px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--acc); }
  .h1 { font-size:58px; font-weight:700; letter-spacing:-.6px; line-height:1.08; }
  .h2 { font-size:40px; font-weight:700; letter-spacing:-.3px; line-height:1.15; }
  .lead { font-size:26px; color:var(--soft); line-height:1.4; }
  .mute { color:var(--mute); }
  .abs { position:absolute; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:12px; box-shadow:0 6px 24px rgba(24,33,43,.07); }
  .pill { display:inline-block; padding:4px 12px; border-radius:6px; font-weight:700; font-size:16px; letter-spacing:1px; }
  .num { font-variant-numeric:tabular-nums; }
  #fader { position:absolute; inset:0; background:var(--bg); pointer-events:none; z-index:99; }
</style>
<div id="fader"></div>
<script>
  const DUR = window.DUR || 10;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  // fraction of an appearance that starts at t0 (seconds or fraction of DUR when <= 1 and frac=true) and lasts d
  const at = (t, t0, d = 0.6) => ease((t - t0) / d);
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function show(node, a, dy = 18) { node.style.opacity = a; node.style.transform = `translateY(${(1 - a) * dy}px)`; }
  function fader(t) { const f = document.getElementById("fader"); f.style.opacity = Math.max(1 - clamp(t / 0.35), clamp((t - (DUR - 0.3)) / 0.3)); }
  async function imgsReady() { await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); }
</script>
