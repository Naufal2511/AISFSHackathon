<!doctype html><html><head><meta charset="utf-8"></head><body>
<!--COMMON-->
<style>
  #head { left:110px; top:70px; }
  #chart { position:absolute; left:110px; top:250px; }
  #why { left:1080px; top:250px; width:730px; }
  .rc { padding:20px 24px; margin-bottom:18px; }
  .rc .top { display:flex; justify-content:space-between; align-items:baseline; }
  .rc .id { font-size:30px; font-weight:700; }
  .rc .sc { font-size:22px; font-weight:700; color:var(--warm); }
  .rc .r { font-size:19px; color:var(--soft); line-height:1.4; margin-top:6px; }
  .rc .p { font-size:16px; color:var(--mute); margin-top:6px; font-weight:600; }
  #foot { left:110px; top:960px; font-size:20px; color:var(--mute); }
</style>
<div class="abs" id="head"><div class="eyebrow">Level 2 · BRD risk</div><div class="h1">13 indicators, each against the herd at the same hours</div></div>
<svg id="chart" width="900" height="690"></svg>
<div class="abs" id="why"></div>
<div class="abs" id="foot">risk = ranked suspicion index (0–1), not a diagnosis · p_top3 = share of 200 resamples of 30-min blocks that keep the cow in the top 3</div>
<script>
const D = __DATA__;
const svg = document.getElementById("chart"), BH = 50, GAP = 14, X0 = 130, W = 700, MAX = 0.45;
const bars = D.rows.map((r, i) => { const y = i * (BH + GAP), top = i < 3;
  el("text", { x: 0, y: y + 33, "font-size": 22, "font-weight": top ? 700 : 500, fill: top ? "#18212b" : "#7a8591" }, svg).textContent = r.id;
  const b = el("rect", { x: X0, y, width: 0, height: BH, rx: 6, fill: top ? "#a85a24" : "#c9d0d7" }, svg);
  const v = el("text", { x: X0 + 8, y: y + 33, "font-size": 20, "font-weight": 700, fill: "#18212b" }, svg);
  return { b, v, r }; });
const typ = X0 + W * 0.10 / MAX;
el("line", { x1: typ, y1: -6, x2: typ, y2: 10 * (BH + GAP), stroke: "#0f5a6b", "stroke-width": 2.5, "stroke-dasharray": "6 5" }, svg);
const tl = el("text", { x: typ + 8, y: 10 * (BH + GAP) + 26, "font-size": 18, fill: "#0f5a6b", "font-weight": 600 }, svg); tl.textContent = "herd-typical ≈ 0.10";
const why = document.getElementById("why");
const cards = D.rows.slice(0, 3).map((r, i) => { const d = document.createElement("div"); d.className = "card rc";
  d.innerHTML = `<div class="top"><span class="id">#${i + 1} ${r.id}</span><span class="sc">${r.score.toFixed(2)}</span></div><div class="r">${r.why}</div><div class="p">in the top 3 in ${Math.round(100 * r.p_top3)} % of resamples</div>`;
  why.appendChild(d); return d; });
window.render = async function (t) {
  show(document.getElementById("head"), at(t, 0.1, 0.6));
  bars.forEach((x, i) => { const a = at(t, 0.5 + 0.08 * i, 0.8); x.b.setAttribute("width", W * a * x.r.score / MAX);
    x.v.setAttribute("x", X0 + W * a * x.r.score / MAX + 10); x.v.textContent = a > 0.05 ? (a * x.r.score).toFixed(2) : ""; });
  cards.forEach((c, i) => show(c, at(t, DUR * (0.25 + 0.2 * i), 0.6), 30));
  show(document.getElementById("foot"), at(t, DUR * 0.7, 0.6));
  fader(t);
};
</script></body></html>
