# Supervisor agent (src/agent). Pick the backend here or with AGENT_BACKEND=<name>.
# Any OpenAI-compatible endpoint works; the API key is read from the env var named in api_key_env
# (never put keys in this file).
backend: ollama

ollama:                      # local Qwen2.5-VL on this Mac:  ollama pull qwen2.5vl:7b
  base_url: http://localhost:11434/v1
  model: qwen2.5vl-agent     # qwen2.5vl:7b with a 16k context (configs/Modelfile.qwen_agent)
  timeout: 300
  max_tokens: 500
  image_max_side: 896        # smaller images = faster prefill on a local model
  keep_images: 1

tamu:                        # TAMU AI Chat API (fill base_url/model from the TAMU portal)
  base_url: ""
  model: ""
  api_key_env: TAMU_API_KEY
  timeout: 120
  max_tokens: 600
  image_max_side: 1024
  keep_images: 2

vllm:                        # Qwen2.5-VL served on an HPRC GPU node with vLLM
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-VL-7B-Instruct
  timeout: 180
  max_tokens: 600
  image_max_side: 1024
  keep_images: 2

agent:
  window_sec: 300            # look at the tracking output in 5-minute windows
  audit_every_min: 30        # scheduled ID check
  max_steps: 6               # tool calls per investigation
  max_flags_per_window: 8    # drastic flags (severity >= 3) are never dropped

triggers:
  pen_size: 10
  missing_min: 20
  max_speed_mps: 3.0
  trusted_world_cameras: [cam1]
  weak_id_conf: 0.60
  behavior_conf: 0.55
