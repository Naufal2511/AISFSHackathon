# End-to-end pipeline (run_pipeline.py): videos -> stage 1 (tracking + identity + behavior) -> stage 2 (brd_agent) -> CSVs -> Level 2.
# Every value can be overridden on the command line; see `python run_pipeline.py --help`.

cameras:
  # Which camera recorded a clip. Rules are tried in this order; a clip no rule places stops the run (never guessed).
  # 1. A folder name on its path, e.g. "Day 1/Cam 01/Event...Avi" (the DVR export layout) or "cam2/".
  folder_pattern: '^cam(?:era)?[\s_-]*0?([1-3])$'
  # 2. The 3 digits after the 14-digit timestamp: Event20261107160019006.Avi -> "006".
  #    Seen on every real clip so far (Day 1 07:19 and 16:00): 006 = cam1, 017 = cam2, 003 = cam3.
  suffix:
    "006": cam1
    "017": cam2
    "003": cam3
  # Sanity check on the first clip of each camera (ffprobe). A mismatch means the mapping above is wrong for this
  # footage, so the run stops; --no-camera-check skips it.
  expected_resolution:
    cam1: [4000, 3000]
    cam2: [2592, 1944]
    cam3: [4000, 3000]

stage1:
  detector: models/angus_det_hprc_m1280.pt   # fine-tuned YOLO26m (Git LFS); main.py's default
  fps: 1.0          # frames per second sampled for tracking. NOT 0.2: on 16:00-16:05, 1 frame / 5 s gave the same
                    # cow ID as 1 fps on only 46% of boxes (cam3: 5%) and the same minute behavior on 39%.
                    # The rest of the pipeline adapts to any rate (behavior grid, identity thresholds).
  imgsz: 1280       # detector input size (main.py default; 640 loses far-field cows on 4K)
  herd_size: 10     # identity cap passed to run_level1.py --pen-size (the pen holds at most 10)
  id_agent: true    # supervisor agent on identity flags only (duplicate_id, id_jump, extra_cow, cow_missing, 30-min audit)
  id_agent_backend: tamu_luna   # configs/agent.yaml profile; needs TAMU_API_KEY in .env

assets:             # Level 2 risk assets (scripts/build_risk_assets.py), built while the remuxed clips are still cached
  breathing: true   # breaths/min from still close windows (decodes short windows at native fps)
  clips: true       # one short low-res clip per cow every few hours (risk cards)

stage2:
  dir: brd_agent    # the agent package (its own configs/, prompts, .env)
  vlm: auto         # auto = brd_agent/.env if present, else TAMU (TAMU_API_KEY in the repo .env); mock = no API calls
  tamu_profile: tamu_luna   # configs/agent.yaml profile used for stage 2 when brd_agent/.env is absent
  workers: 8        # cows verified in parallel (threads; the time is spent waiting on the VLM and on ffmpeg)
  max_agent_runs_per_hour: 120   # full BRD-agent runs per hour of footage (10 cows = 600 cow-minutes/h, so ~20%);
                                 # the rest keep the rule-checked stage 1 label. Night sends every minute to the
                                 # agent otherwise (10 min of night = 70 runs, ~620k TAMU tokens).
